name = "gamen"
version = "0.1.0"
defaultTargets = ["Gamen", "Widgets", "Notebooks", "gamen-validate", "dcleg-service", "DclegProofs"]
testDriver = "tests"
# Never reuse artifacts from Lake's shared cache: `gamen-validate` stamps its
# git commit in at compile time (`Validate/BuildInfo.lean`), and the cache is
# keyed on source hashes only, so a cached build could report another
# commit. This package setting overrides `LAKE_ARTIFACT_CACHE`.
enableArtifactCache = false

# ── Dependencies ────────────────────────────────────────────────────
# Pinned to releases built for the toolchain in `lean-toolchain`.
# The core library (`Gamen`) uses neither; they serve tests and widgets.

[[require]]
name = "plausible"            # property-based testing (QuickCheck analog)
git = "https://github.com/leanprover-community/plausible"
rev = "v4.34.0"

[[require]]
name = "proofwidgets"         # interactive infoview widgets for the notebooks
git = "https://github.com/leanprover-community/ProofWidgets4"
rev = "v0.0.111"

# ── Libraries ───────────────────────────────────────────────────────

# The port of gamen-hs. Root module `Gamen.lean` imports every module.
[[lean_lib]]
name = "Gamen"

# Teaching widgets (ProofWidgets) used by the notebooks.
[[lean_lib]]
name = "Widgets"
globs = ["Widgets.+"]

# Teaching notebooks: Lean files ported from the Gamen.jl Pluto notebooks.
[[lean_lib]]
name = "Notebooks"
globs = ["Notebooks.+"]

# Machine-checked proofs of results from the DCLEG thesis (Chapters 3–5),
# written for Jeremiah. Prop-level, over arbitrary types; imports neither
# `Gamen` nor Mathlib. Start at `DclegProofs/README.md`.
[[lean_lib]]
name = "DclegProofs"
globs = ["DclegProofs.+"]

[[lean_lib]]
name = "Tests"

# `gamen-validate`'s non-`IO` core (`Validate.lean`, `Validate/Core.lean`),
# so `Tests.Main` can import `Validate.Core` without its `main` colliding
# with the `gamen-validate` executable's own `main`.
[[lean_lib]]
name = "Validate"

# `dcleg-service`'s non-`IO` core (`DclegService/Core.lean`), importable
# from `Tests.Main` for the same reason as `Validate`.
[[lean_lib]]
name = "DclegService"

# ── Executables ─────────────────────────────────────────────────────

# JSON Lines service, wire-compatible with gamen-hs `gamen-validate`.
[[lean_exe]]
name = "gamen-validate"
root = "Validate"

# Stateful JSON Lines service for DCLEG models, wire-compatible with
# gamen-hs `dcleg-service` (plans/dcleg-service-port-2026-10-05.md).
[[lean_exe]]
name = "dcleg-service"
root = "DclegService"

# `lake test`
[[lean_exe]]
name = "tests"
root = "Tests.Main"

# `lake exe slowtests`: the seven `==>`-shaped properties from
# `test/Properties.hs` at Haskell's full sizes/counts/discard-caps
# (~460s in gamen-hs; kept out of `lake test` for the same reason).
[[lean_exe]]
name = "slowtests"
root = "Tests.SlowMain"
