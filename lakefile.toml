name = "gamen"
version = "0.1.0"
defaultTargets = ["Gamen", "Widgets", "Notebooks", "gamen-validate"]
testDriver = "tests"

# ── Dependencies ────────────────────────────────────────────────────
# Pinned to releases built for the toolchain in `lean-toolchain`.
# The core library (`Gamen`) uses neither; they serve tests and widgets.

[[require]]
name = "plausible"            # property-based testing (QuickCheck analog)
git = "https://github.com/leanprover-community/plausible"
rev = "v4.34.0"

[[require]]
name = "proofwidgets"         # interactive infoview widgets for the notebooks
git = "https://github.com/leanprover-community/ProofWidgets4"
rev = "v0.0.111"

# ── Libraries ───────────────────────────────────────────────────────

# The port of gamen-hs. Root module `Gamen.lean` imports every module.
[[lean_lib]]
name = "Gamen"

# Teaching widgets (ProofWidgets) used by the notebooks.
[[lean_lib]]
name = "Widgets"
globs = ["Widgets.+"]

# Teaching notebooks: Lean files ported from the Gamen.jl Pluto notebooks.
[[lean_lib]]
name = "Notebooks"
globs = ["Notebooks.+"]

[[lean_lib]]
name = "Tests"

# ── Executables ─────────────────────────────────────────────────────

# JSON Lines service, wire-compatible with gamen-hs `gamen-validate`.
[[lean_exe]]
name = "gamen-validate"
root = "Validate"

# `lake test`
[[lean_exe]]
name = "tests"
root = "Tests.Main"
